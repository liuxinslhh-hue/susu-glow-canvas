<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090e"><meta name="description" content="用指尖拨动流光，把名字写进夜色。Susu的互动编程实验。"><title>流光画布 · Susu Lab</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="art" aria-label="互动流光画布，拖动手指或鼠标绘画"></canvas>
<header><a class="brand" href="#" aria-label="流光画布首页"><span class="mark">✳</span><span>SUSU <b>LAB</b></span></a><span class="edition">EXPERIMENT 001 <i></i> LIVE CANVAS</span><button id="clean" class="icon" title="隐藏界面" aria-label="隐藏界面">↗</button></header>
<main><section class="intro"><p class="eyebrow">A LITTLE LIGHT, MADE BY YOU</p><h1>让心情，<br>有<span>流动的形状。</span></h1><p class="sub">用指尖拨动夜色，把此刻留在光里。</p><div class="hint"><span class="dot"></span> 触碰文字，拨散后会重新聚合</div></section>
<div class="name-wrap"><canvas id="letter" aria-hidden="true"></canvas></div>
</main>
<section class="dock" aria-label="画布控制"><div class="palette"><span class="label">光的颜色</span><div class="swatches" role="group" aria-label="选择配色"><button class="swatch active" data-palette="0" aria-label="极光" aria-pressed="true" style="--a:#6ef6ed;--b:#bd6fff"></button><button class="swatch" data-palette="1" aria-label="落日" aria-pressed="false" style="--a:#ffb471;--b:#ff527d"></button><button class="swatch" data-palette="2" aria-label="深海" aria-pressed="false" style="--a:#64baff;--b:#6475ff"></button><button class="swatch" data-palette="3" aria-label="玫瑰" aria-pressed="false" style="--a:#ffb5d6;--b:#b18aff"></button></div><span id="paletteName">极光</span></div><span class="divider"></span><label class="name-field"><span class="label">写进流光</span><input id="name" maxlength="12" value="流光" placeholder="名字，最多6字" autocomplete="off" aria-label="名字或心情，最多6字，暂不支持表情"></label><span class="divider second"></span><div class="actions"><button id="share" class="primary">分享名字 ↗</button><button id="reset" class="secondary">重新流动</button><button id="save" class="primary">保存这一刻 <span>↓</span></button></div></section>
<footer><span>由你创造，每一刻都不同。</span><button id="motion">暂停流动</button><span>CREATIVE CODING · SUSU</span></footer><div class="capture-tools"><button id="replay">重播演示</button><button id="restore" hidden>显示界面</button></div><input id="shareLink" hidden readonly aria-label="分享链接"><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
